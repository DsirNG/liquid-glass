name: Browser Runtime Matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.browser }} runtime matrix
        run: pnpm run runtime:matrix -- --browser=${{ matrix.browser }}

      - name: Upload runtime matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-matrix-${{ matrix.browser }}
          if-no-files-found: ignore
          path: tests/runtime-matrix/artifacts/
